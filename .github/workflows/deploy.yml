name: Build Web App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./web # Chạy các lệnh NPM bên trong thư mục web

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      # `web` là repo riêng (private) nên phải checkout kèm PAT.
      - name: Checkout React App
        uses: actions/checkout@v4
        with:
          repository: uitbestteam/checkpoint-app-reactjs
          path: web
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Sử dụng bản LTS ổn định

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

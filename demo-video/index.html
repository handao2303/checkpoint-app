          cap: ["HỒ SƠ", "Hồ sơ du lịch của bạn", "Cấp độ, XP, số cờ đã cắm, chuỗi ngày và hành trình."],
          chips: [{ s: "Lá cờ đã cắm", count: ["", 192, "", 0] }, { t: "Cấp 5", s: "Lên cấp theo XP" }] },
        { img: "passport", dur: 2.8, nav: 3, via: "sheet", zoom: 1.6, tap: [76, 347],
          cap: ["HỘ CHIẾU", "Bộ sưu tập con dấu", "Mỗi thành phố mới mở khoá một con dấu hộ chiếu."],
          chips: [{ s: "Con dấu thành phố", count: ["", 13, "", 0] }] },
        { img: "stamp", dur: 2.8, nav: 3, via: "sheet", tap: [69, 304],
          cap: ["HỘ CHIẾU", "Khoảnh khắc theo thành phố", "Toàn bộ ảnh check-in được gom theo từng con dấu."] },
        { img: "moment", dur: 2.6, nav: 3, via: "fade", tap: [366, 22],
          cap: ["KHOẢNH KHẮC", "Ngắm trọn từng khoảnh khắc", "Xem ảnh toàn màn hình, xoay và lướt nhanh."] },
        { img: "map-0", dur: 2.2, nav: 4, via: "fade", zoom: 1.6, tap: [195, 759],
          cap: ["CHECK-IN", "Cắm cờ nơi bạn đứng", "Định vị chính xác, chụp ảnh và nhận XP ngay lập tức."],
          chips: [{ t: "Định vị chính xác", s: "Cắm cờ đúng nơi bạn đứng" }] },
        { img: "checkin", dur: 3.4, nav: 4, via: "sheet",
          cap: ["BẮT ĐẦU", "Bắt đầu hành trình", "Đăng nhập để cắm cờ, nhận XP và mở khoá con dấu thành phố."],
          chips: [{ t: "Miễn phí", s: "Cài như app trên điện thoại" }] },
      ];

      const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
      const fmt = (v, d) => (d ? v.toFixed(d) : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."));
      const words = (s) => s.split(/\s+/).map((w) => '<span class="w"><span class="wi" data-layout-allow-overlap>' + w + "</span></span>").join(" ");

      // ---------------- Build DOM (setup only) ----------------
      const app = document.getElementById("app");
      const capWrap = document.getElementById("captions");
      const chipWrap = document.getElementById("chips");

      STEPS.forEach((s, k) => {
        let html = '<div class="scr" id="scr-' + k + '"><img src="assets/screens/' + s.img + '.jpg" alt="" />';
        if (s.strip) {
          const [x, y, w, h] = s.strip.rect;
          html += '<div class="strip-win" style="left:' + x * S + "px;top:" + y * S + "px;width:" + w * S + "px;height:" + h * S + 'px"><img id="strip-' + k + '" src="assets/screens/' + s.strip.src + '.jpg" alt="" /></div>';
        }
        app.insertAdjacentHTML("beforeend", html + "</div>");

        capWrap.insertAdjacentHTML(
          "beforeend",
          '<div class="caption" id="cap-' + k + '"><div class="step" data-layout-allow-overlap>' + s.cap[0] + "</div><h2>" + words(s.cap[1]) + "</h2><p>" + s.cap[2] + "</p></div>"
        );

        (s.chips || []).forEach((c, i) => {
          const title = c.count ? c.count[0] + fmt(0, c.count[3]) + c.count[2] : c.t;
          chipWrap.insertAdjacentHTML(
            "beforeend",
            '<div class="chip" id="chip-' + k + "-" + i + '" style="top:' + (260 + i * 112) + 'px"><div class="ico">' + CHECK + "</div><div><b>" + title + "</b><small>" + c.s + "</small></div></div>"
          );
        });
      });
      app.insertAdjacentHTML("beforeend", '<div id="ripple"></div><div id="touch"></div>');

      // Decorative passport stamps drifting in the background
      const STAMPS = [
        [120, 140, 150, "HCM"], [1700, 760, 180, "HN"], [880, 40, 130, "ĐN"], [1520, 90, 120, "SG"], [40, 560, 110, "HUẾ"],
      ];
      STAMPS.forEach(([x, y, d, label], i) => {
        document.getElementById("bg-layer").insertAdjacentHTML(
          "beforeend",
          '<svg class="stamp-bg" id="stamp-bg-' + i + '" style="left:' + x + "px;top:" + y + "px;width:" + d + "px;height:" + d + 'px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#c2410c" stroke-width="2"/><path d="M50 30 L56 47 L74 50 L56 54 L50 72 L44 54 L26 50 L44 47 Z" fill="#c2410c"/></svg>'
        );
      });

      // ---------------- Timing ----------------
      const starts = [0];
      let acc = INTRO + STEPS[0].dur;
      for (let k = 1; k < STEPS.length; k++) {
        starts.push(acc);
        acc += STEPS[k].dur;
      }
      const startOf = (k) => (k < STEPS.length ? starts[k] : acc);
      const stageEnd = acc; // == OUTRO

      // ---------------- Timeline ----------------
      const scrs = STEPS.map((s, k) => "#scr-" + k);
      STEPS.forEach((s, k) => {
        if (k === 0) return;
        if (s.via === "fade") tl.set(scrs[k], { opacity: 0 }, 0);
        else if (s.via === "sheet") tl.set(scrs[k], { clipPath: "inset(100% 0% 0% 0%)" }, 0);
        else tl.set(scrs[k], { xPercent: 100 }, 0);
      });
      tl.set(["#touch", "#ripple"], { xPercent: -50, yPercent: -50 }, 0);
      tl.set(".caption .wi", { yPercent: 115 }, 0);

      // Ambient background
      tl.to("#blob-a", { x: -140, y: 80, scale: 1.12, duration: 8, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
      tl.to("#blob-b", { x: 180, y: -120, duration: 9, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      tl.to("#blob-c", { x: -120, y: 140, duration: 7, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      STAMPS.forEach((st, i) => {
        tl.fromTo("#stamp-bg-" + i, { rotation: -10 + i * 7 }, { rotation: 30 + i * 7, transformOrigin: "50% 50%", duration: 57, ease: "none" }, 0);
      });

      // Intro
      tl.fromTo("#intro-logo", { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.8)" }, 0.15);
      tl.fromTo("#intro .li", { yPercent: 110 }, { yPercent: 0, duration: 0.9, ease: "expo.out", stagger: 0.22 }, 0.35);
      tl.to("#intro .li", { yPercent: -110, duration: 0.6, ease: "power3.in", stagger: 0.08 }, 2.75);
      tl.to("#intro-logo", { scale: 0, opacity: 0, duration: 0.5, ease: "power3.in" }, 2.8);

      tl.fromTo(
        "#phone-entry",
        { opacity: 0, x: 420, y: 260, rotationY: -48, rotationX: 22, rotationZ: 10, scale: 0.75 },
        { opacity: 1, x: 0, y: 0, rotationY: 0, rotationX: 0, rotationZ: 0, scale: 1, duration: 1.5, ease: "expo.out" },
        3.15
      );
      tl.fromTo("#glare", { opacity: 0, xPercent: -60 }, { opacity: 1, xPercent: 60, duration: 1.1, ease: "power2.inOut" }, 3.6);
      tl.to("#glare", { opacity: 0, duration: 0.25 }, 4.75);
      tl.fromTo("#phone-float", { y: 0, rotationY: 0 }, { y: -14, rotationY: -5, rotationX: 2, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 14 }, 4.6);
      tl.to(".brand", { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.5);
      tl.to("#nav", { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.0);

      // Section nav highlight
      let curNav = -1;
      STEPS.forEach((s, k) => {
        if (s.nav === curNav) return;
        const t = k === 0 ? 4.0 : startOf(k);
        const items = document.querySelectorAll(".nav-item");
        if (curNav >= 0) {
          tl.to(items[curNav].querySelector(".nav-on"), { opacity: 0, duration: 0.35 }, t);
          tl.to(items[curNav].querySelector("span"), { color: "#6e5b50", duration: 0.35 }, t);
          tl.to(items[curNav].querySelector("i"), { backgroundColor: "#d9c6b8", duration: 0.35 }, t);
        }
        tl.fromTo(items[s.nav].querySelector(".nav-on"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, t);
        tl.to(items[s.nav].querySelector("span"), { color: "#ffffff", duration: 0.35 }, t);
        tl.to(items[s.nav].querySelector("i"), { backgroundColor: "#ffffff", duration: 0.35 }, t);
        curNav = s.nav;
      });

      STEPS.forEach((s, k) => {
        const t = startOf(k);
        const next = startOf(k + 1);
        const hold = k === 0 ? INTRO : t; // when this screen's own beat begins
        const cap = "#cap-" + k;

        // Caption
        const tin = k === 0 ? 3.7 : t + 0.15;
        tl.set(cap, { opacity: 1 }, tin);
        tl.fromTo(cap + " .step", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, tin);
        tl.fromTo(cap + " .wi", { yPercent: 115, rotationZ: 4 }, { yPercent: 0, rotationZ: 0, duration: 0.75, ease: "expo.out", stagger: 0.06 }, tin + 0.05);
        tl.fromTo(cap + " p", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, tin + 0.25);
        if (k < STEPS.length - 1) {
          tl.to(cap + " .wi", { yPercent: -115, duration: 0.35, ease: "power3.in", stagger: 0.03 }, next - 0.3);
          tl.to([cap + " .step", cap + " p"], { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, next - 0.3);
          tl.set(cap, { opacity: 0 }, next + 0.1);
        }

        // Arrival
        if (k > 0) {
          if (s.via === "fade") {
            tl.fromTo(scrs[k], { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, t);
          } else if (s.via === "sheet") {
            tl.fromTo(scrs[k], { clipPath: "inset(100% 0% 0% 0%)", y: 60 }, { clipPath: "inset(0% 0% 0% 0%)", y: 0, duration: 0.6, ease: "expo.out" }, t);
          } else {
            tl.to(scrs[k], { xPercent: 0, duration: 0.6, ease: "expo.inOut" }, t);
            tl.to(scrs[k - 1], { xPercent: -35, duration: 0.6, ease: "expo.inOut" }, t);
            tl.fromTo("#phone", { rotationY: 0 }, { rotationY: -7, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, t);
          }
        }

        // Smooth content scroll (real captured content)
        if (s.strip) {
          const st = s.strip;
          const a = hold + st.at;
          tl.to("#strip-" + k, { y: -st.to * S, duration: st.d, ease: "power2.inOut" }, a);
          if (st.back) tl.to("#strip-" + k, { y: 0, duration: st.back, ease: "power3.inOut" }, a + st.d + 0.2);
        }

        // Finger glides in, presses, ripples
        if (s.tap) {
          const x = s.tap[0] * S;
          const y = s.tap[1] * S;
          const tt = next - 0.4;
          tl.fromTo("#touch", { x: x + 60, y: y + 90, opacity: 0, scale: 1.2 }, { immediateRender: false, x, y, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, tt - 0.45);
          tl.to("#touch", { scale: 0.75, duration: 0.1, ease: "power2.in" }, tt);
          tl.to("#touch", { scale: 1, opacity: 0, duration: 0.35, ease: "power2.out" }, tt + 0.1);
          tl.fromTo("#ripple", { x, y, scale: 0.6, opacity: 1 }, { immediateRender: false, x, y, scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out" }, tt + 0.05);
        }

        // Feature chips
        (s.chips || []).forEach((c, i) => {
          const el = "#chip-" + k + "-" + i;
          const ci = hold + 0.5 + i * 0.22;
          tl.fromTo(el, { opacity: 0, x: 60, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, ci);
          tl.fromTo(el + " .ico", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, ci + 0.15);
          if (c.count) {
            const [pre, to, suf, d] = c.count;
            const b = document.querySelector(el + " b");
            const o = { v: 0 };
            tl.to(o, { v: to, duration: 1.3, ease: "power3.out", onUpdate: () => (b.textContent = pre + fmt(o.v, d) + suf) }, ci + 0.1);
          }
          if (k < STEPS.length - 1) tl.to(el, { opacity: 0, x: 30, duration: 0.3, ease: "power2.in" }, next - 0.3);
        });
      });

      // Check-in moment: location pulses behind the phone
      const tci = startOf(STEPS.length - 2);
      ["#ring-0", "#ring-1", "#ring-2"].forEach((r, i) => {
        tl.fromTo(r, { scale: 0.7, opacity: 0.5 }, { immediateRender: false, scale: 1.9, opacity: 0, duration: 1.3, ease: "power1.out", repeat: 1 }, tci + 0.3 + i * 0.4);
      });

      // ---- Virtual camera: zoom into taps and scrolling content, back out on transitions ----
      const APP_X = 1092; // app origin on stage (phone-wrap + bezel)
      const APP_Y = 127; // + status bar
      const FOCUS = [1340, 540]; // a zoom target is pulled halfway toward this screen point
      let camFree = 0;
      let camZoomed = false;
      const cam = (t, s, fx, fy, d) => {
        t = Math.max(t, camFree);
        let x = 0;
        let y = 0;
        if (s !== 1) {
          const px = APP_X + fx * S;
          const py = APP_Y + fy * S;
          x = px + 0.5 * (FOCUS[0] - px) - s * px;
          y = py + 0.5 * (FOCUS[1] - py) - s * py;
          x = Math.max(x, 960 - s * 1080); // keep the phone's left edge clear of the captions
        }
        tl.to("#cam", { x, y, scale: s, duration: d, ease: "power3.inOut" }, t);
        camFree = t + d;
        camZoomed = s !== 1;
      };
      tl.set("#cam", { transformOrigin: "0% 0%" }, 0);
      STEPS.forEach((s, k) => {
        const next = startOf(k + 1);
        const hold = k === 0 ? INTRO : startOf(k);
        if (s.strip) {
          const [x, y, w, h] = s.strip.rect;
          cam(hold + 0.15, 1.3, x + w / 2, y + h / 2, 0.6);
        }
        if (s.zoom && s.tap) cam(next - 1.05, s.zoom, s.tap[0], s.tap[1], 0.6);
        if (camZoomed && k < STEPS.length - 1) cam(next + 0.05, 1, 0, 0, 0.65);
      });

      // ---- Finale: camera pulls out, the phone joins a wall of screens ----
      const W = stageEnd;
      const WALL_IMGS = ["map-3", "disc", "place", "board", null, "prof", "passport", "stamp", "moment"];
      const wallEl = document.getElementById("wall");
      WALL_IMGS.forEach((img, i) => {
        if (!img) return;
        wallEl.insertAdjacentHTML("beforeend", '<div class="tile" style="left:' + (960 + (i - 4) * 205 - 89) + 'px"><img src="assets/screens/' + img + '.jpg" alt="" /></div>');
      });
      document.getElementById("wall-title").innerHTML = words("Một app. Trọn vẹn hành trình.");

      tl.to(["#cap-" + (STEPS.length - 1), ".brand", "#nav", "#chips"], { opacity: 0, duration: 0.4, ease: "power2.in" }, W - 0.1);
      const PS = 0.42; // phone shrinks to wall-tile size
      tl.to("#cam", { x: 960 - PS * 1292, y: 540 - PS * 540, scale: PS, duration: 1.1, ease: "expo.inOut" }, Math.max(W, camFree));
      tl.fromTo(".tile", { opacity: 0, y: 180, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "expo.out", stagger: { each: 0.06, from: "center" } }, W + 0.55);
      tl.set("#wall-title", { opacity: 1 }, W + 0.75);
      tl.fromTo("#wall-title .wi", { yPercent: 115 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.06 }, W + 0.8);
      tl.to("#world", { scale: 0.93, x: -30, duration: OUTRO - W - 1.4, ease: "sine.inOut" }, W + 1.4);

      // Stage exit
      tl.to("#stage-inner", { opacity: 0, duration: 0.5, ease: "power2.in" }, OUTRO - 0.3);

      // Outro
      tl.fromTo("#wipe", { scale: 0 }, { scale: 24, duration: 0.9, ease: "expo.inOut" }, OUTRO - 0.1);
      tl.fromTo("#outro-logo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.8)" }, OUTRO + 0.5);
      tl.fromTo("#outro-title span", { opacity: 0, rotationX: -90, yPercent: 40 }, { opacity: 1, rotationX: 0, yPercent: 0, duration: 0.9, ease: "expo.out", stagger: 0.05 }, OUTRO + 0.7);
      tl.fromTo("#outro-line", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, OUTRO + 1.4);
      tl.fromTo("#outro-url", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.8)" }, OUTRO + 1.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
